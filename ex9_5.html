<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/filmes">

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css">
    
    <title>Filmes para assistir </title>
</head>
<body>
    <img src="img/ " alt="Imagem Astral" class="Imagem-logo">
    <div class="container-fluid">
        <div class="row" id="divTitulo">
            <div class="col-sm-7">
            <h1> Filmes para assistir Lista </h1>
        </div>
        
     <div class="col-sm-3 painel-signos">
        <h2>Qual é o nome do filme?</h2>
        <form>
        <fieldset>
        <input type="text" value="Filme" name="signo" id="nomeFilme">
        <label for="rbFilme">Filme</label><br>
        <input type="text" value="Categoria" name="signo" id="categoria">
        <label for="rbCategoria">Filme</label><br>
        </fieldset>
        <button type="button">Salvar para assistir</button>
        </form>
        
     </div>
        <div class="col-sm-2">
        
     </div>
     
     <div id="infoSigno">
        <img id="imgSigno" class="d-none imagem-signo" alt="Imagem do signo selecionado">
        <h2 id="outNome"></h2>
        <p id="outElemento"></p>
        <p id="outCombina"></p>
        <p id="outCaracteristicas"></p>
        <p id="outPeriodo"></p>
    </div>

    <p id="outMensagem"></p>

    <div class="resultado">
        <p class="mensagem-signo">Seu filme salvo aparecerá aqui.</p>
    </div>
    <footer class="rodape">
    <p>&copy; 2026 Filmes JavaScript. Desenvolvido por Roberto Borba.</p>
</footer>
</div>

        src="js/ex9_4.js"></script>
